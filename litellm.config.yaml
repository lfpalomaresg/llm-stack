# LLM Stack v5 — LiteLLM proxy config
# Un solo endpoint (localhost:4000/v1) para opencode, hermes y scripts.
# Los clientes usan SOLO los alias model_name; cambiar un modelo = editar aquí.

model_list:
  # ── LOCAL (LM Studio, localhost:1234) ──────────────────────────
  - model_name: local-coder
    litellm_params:
      # 2026-09-10 (OK operador): local-coder → Nex. El Coder-30B se retira (su hueco,
      # código local sensible/acotado, lo cubre Nex — agentic-tuned, no-think). Red de
      # seguridad: cualquier consumidor que pida local-coder recibe Nex, no un 404.
      # Código NO sensible grande → cloud (dpsk / cloud-coder-value). Backup .bak.20260910-coder-a-nex
      model: openai/nex-n2-mini-local
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  - model_name: local-general
    litellm_params:
      # ORQUESTADOR. 2026-09-08 (OK operador): sustituido Qwen3.6-35B-A3B por Nex-N2-mini
      # (35B-A3B de nex-agi, MISMA arquitectura qwen3_5_moe y footprint ~20GB, pero afinado
      # para AGENTES). Bench VS ganado por Nex: salida directa sin thinking-dump, JSON estricto,
      # tool-use. El 35B se conserva en disco (alias local-35b) por si se revierte.
      model: openai/nex-n2-mini-local
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # local-35b RETIRADO 2026-09-10 (OK operador "borra"): el Qwen3.6-35B se borró del disco.
  # Nex es el único grande local. Volver al 35B = re-descargar (~19 GB) + re-crear el alias.

  # local-fast: rol "rápido" (lookups, /no_think) que usa enrutar.sh como destino y
  # degradado. 2026-09-08: el MODELO qwen3-8b se jubiló y borró; local-fast apunta ahora
  # al MISMO R1-8B que local-worker (un solo 8B físico, sin duplicar). No es un modelo extra,
  # es un segundo punto de entrada al R1-8B para el camino rápido. Backup: .bak.20260908-retire8b.
  - model_name: local-fast
    litellm_params:
      model: openai/deepseek/deepseek-r1-0528-qwen3-8b
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  - model_name: local-embed
    litellm_params:
      model: openai/text-embedding-qwen3-embedding-0.6b
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # ── Perfil AGENTE (añadido 2026-08-21) ─────────────────────────
  # Workers ×N con razonamiento R1 (un solo modelo cargado sirve a varios
  # agentes en paralelo — PARALLEL=4 en LM Studio)
  - model_name: local-worker
    litellm_params:
      model: openai/deepseek/deepseek-r1-0528-qwen3-8b
      api_base: http://localhost:1234/v1
      api_key: lm-studio
      # v5.4.1 (2026-08-22): muestreo recomendado por DeepSeek para destilados R1.
      # Sin esto manda el defecto de LM Studio (~0.8) — medido: pifias numéricas
      # (RevPAR 93 donde tocaba 102; "97 no es primo") y divagues hasta el techo.
      temperature: 0.6
      top_p: 0.95

  # Auditor local para material sensible (familia distinta a Qwen ⇒ cumple
  # la regla "revisor ≠ productor" de JERARQUIA_IA). Carga JIT, no residente.
  - model_name: local-auditor
    litellm_params:
      model: openai/gemma-4-e4b-it-optiq
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # ── Revisión / razonamiento local (2026-09-07) ─────────────────
  # gpt-oss-20b (OpenAI, clase o3-mini): 2o worker de razonamiento agentico/tool-use
  # Y revisor primario de la CAPA 1 del careo local. Familia != Qwen/Gemma. Carga JIT.
  - model_name: local-reasoner
    litellm_params:
      model: openai/openai/gpt-oss-20b
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # Phi-4-reasoning-plus (Microsoft): revisor dedicado NO-Qwen de la Capa 1 del careo
  # (voto de linaje independiente). Denso 14B, ~8GB. Carga JIT.
  - model_name: local-reviewer-ms
    litellm_params:
      model: openai/phi-4-reasoning-plus-mlx
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # Josiefied-Qwen3-30B-A3B abliterado (MoE): generalista SIN FRENOS, bajo demanda.
  # 100% local => frontera intacta. Carga JIT, NUNCA residente. Uso: brainstorm/red-team propio.
  - model_name: local-uncensored
    litellm_params:
      model: openai/josiefied-qwen3-30b-a3b-abliterated-v2
      api_base: http://localhost:1234/v1
      api_key: lm-studio

  # ── GRATIS vía Antigravity CLI (agy-bridge, localhost:4010) ────
  # agy no tiene modo servidor — agy-bridge.py es un puente HTTP compatible
  # con OpenAI que lo expone como modelo de verdad (21/08). Necesario para que
  # opencode (que habla DIRECTO con LiteLLM, nunca por enrutador-ia) también
  # pueda llegar a estos destinos, no solo Claude Code/hermes vía enrutar.sh.
  - model_name: gpt-oss-free
    litellm_params:
      model: openai/gpt-oss-free
      api_base: http://localhost:4010/v1
      api_key: agy-bridge

  # gemini-free RETIRADO 2026-09-08 (OK operador): fiabilidad medida 25% en el log;
  # auditor-free + gpt-oss-free cubren lo NO sensible. (agy-bridge aún lo expone; alias fuera.)

  - model_name: auditor-free
    litellm_params:
      model: openai/auditor-free
      api_base: http://localhost:4010/v1
      api_key: agy-bridge

  # ── CLOUD (OpenRouter, prepago sin auto-recarga) ───────────────
  # Trigger cloud-coder: local falla tests 2x o tarea #critica
  - model_name: cloud-coder
    litellm_params:
      # v5.4.3 (2026-08-28): GLM-5.2 -> GLM-5.3. Medido con bench-coder-or.py (6/6 ambos):
      # GLM-5.3 usa ~5x menos tokens/tarea (145 vs 691) -> 4x MAS BARATO por tarea pese
      # a mayor precio/token, y mas potente en codigo duro (81 Terminal-Bench). GLM-5.2
      # era el peor de 4 candidatos en coste/tarea. Backup: .bak.20260828-glm53
      model: openrouter/z-ai/glm-5.3           # $1.40/$4.40 por M · 1.3M ctx · pero ~5x menos verboso
      api_key: os.environ/OPENROUTER_API_KEY

  # Escalon de codigo LIGERO: 38x mas barato que el viejo GLM-5.2 por tarea, 6/6 en el bench.
  - model_name: cloud-coder-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash     # $0.075/$0.25 por M · rey del valor (mas lento)
      api_key: os.environ/OPENROUTER_API_KEY

  # cloud-coder-next (Qwen3-Coder-Next 80B) RETIRADO 2026-09-08 (OK operador): apenas
  # se usaba; cloud-coder-value (V4-Pro) cubre el escalado barato y cloud-coder (GLM-5.3) lo duro.

  # Trigger: comando explícito tipo /repo-audit (repo entero + logs).
  # 2026-09-07 (OK operador): megacontext por defecto -> DeepSeek-V4-Pro
  # ($0.617/$1.233, 1M ctx), ~12x mas barato que Kimi-K3 en output y ademas razona+codifica.
  - model_name: cloud-megacontext
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro   # $0.617/$1.233 por M · 1M ctx
      api_key: os.environ/OPENROUTER_API_KEY

  # Techo multimodal duro / long-horizon (la opcion de 1M mas cara del tablero; solo cuando toque).
  - model_name: cloud-megacontext-max
    litellm_params:
      model: openrouter/moonshotai/kimi-k3         # $3/$15 por M · 1M ctx
      api_key: os.environ/OPENROUTER_API_KEY

  # Coder de VALOR (default de escalado): mismo V4-Pro, intent codigo. GLM-5.3 (cloud-coder)
  # queda solo para lo mas duro. ~3.5x mas barato en output que GLM-5.3.
  - model_name: cloud-coder-value
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro   # $0.617/$1.233 por M · 1M ctx
      api_key: os.environ/OPENROUTER_API_KEY

  # Razonamiento / mates barato (hueco que faltaba). Tier pesado = cloud-megacontext (V4-Pro).
  - model_name: cloud-reasoning
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2     # $0.269/$0.400 por M · 164k ctx
      api_key: os.environ/OPENROUTER_API_KEY

  # Trigger: vídeo / docs visuales que local-general no resuelve
  - model_name: cloud-vision
    litellm_params:
      model: openrouter/minimax/minimax-m3     # $0.30/$1.20 por M · 1M ctx
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true        # tolera params que un backend no soporte
  # num_retries=1 es también la tapa anti-tormenta (incidente 21/08, ver
  # incidente-panic-gpu.md §9): los errores de contexto de LM Studio llegan
  # envueltos como APIConnectionError (clase reintentable) aunque son
  # DETERMINISTAS — reintentar no arregla nada y alimenta el churn de cargas.
  # NO subir este valor sin releer ese incidente.
  num_retries: 1
  request_timeout: 600

# SIN fallbacks (decisión 2026-08-02): si el modelo pedido no puede cargarse
# (guardarraíl de LM Studio con otro grande en RAM), el error debe ser VISIBLE
# — "cambia de perfil con stack.sh" — no una degradación silenciosa al 8B que
# te hace creer que hablas con el grande.
