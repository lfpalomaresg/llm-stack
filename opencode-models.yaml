# Catálogo de modelos que opencode expone — fuente de nombres y límites
#
# LitellM (~/llm-stack/litellm.config.yaml) manda en QUÉ modelo sirve cada alias.
# Este fichero manda en CÓMO se presenta ese alias dentro de opencode (nombre visible,
# tool_call, reasoning, límites de contexto/salida y si se expone o no).
#
# Regenerar:  ~/llm-stack/.venv/bin/python3 ~/llm-stack/gen-opencode-models.py
# Verificar:  ... --check     (exit 1 si opencode.json no coincide con esta fuente)
#
# expose: false  -> el alias existe en LiteLLM pero NO se ofrece en el selector de opencode.

